version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: cbrioness-kirocrew_web_1
      APP_PORT: 8117

  web:
    # Published multi-arch image built by GitHub Actions (see .github/workflows).
    # Umbrel pulls this image; it does not build from a Dockerfile.
    image: ghcr.io/cbrioness/kirocrew-umbrel:latest
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "8117:8117"
    volumes:
      # Persist KiroCrew workspace, config, memory, and kiro-cli auth
      # so they survive restarts and updates.
      - ${APP_DATA_DIR}/data/kiro-crew:/root/.kiro/crew
      - ${APP_DATA_DIR}/data/kiro-cli:/root/.aws/sso
      - ${APP_DATA_DIR}/data/local:/root/.local/share/kiro
    environment:
      KIROCREW_HOST: 0.0.0.0
      KIROCREW_PORT: "8117"
