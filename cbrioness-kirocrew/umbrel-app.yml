manifestVersion: 1
id: cbrioness-kirocrew
category: ai
name: KiroCrew
version: "1.0.0"
tagline: Autonomous AI agent layer with memory, jobs, and subagents
description: >-
  KiroCrew is an autonomous AI agent layer that runs on your own machine on top
  of the kiro-cli backend. It adds persistent memory, scheduled jobs, background
  subagents, self-learning, and multi-session orchestration, accessible from a
  web dashboard.


  IMPORTANT: KiroCrew requires the kiro-cli backend to be authenticated with your
  account. After installing, open a terminal into the container and run
  `kiro-cli login` (device login via browser) before the agent can talk to the
  LLM. See the repository README for the full setup steps.
releaseNotes: >-
  First release of the KiroCrew community app for umbrelOS (ARM64).
